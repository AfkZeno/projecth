[versions]
exposed = "1.2.0"
h2 = "2.4.240"
koin = "4.2.0"
kotlin = "2.3.21"
logback = "1.5.21"
bcrypt-version = "0.4"
postgre = "1.1.1.RELEASE"
b2 = "1.6.82"

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }
h2database-h2 = { module = "com.h2database:h2", version.ref = "h2" }
h2database-r2dbc = { module = "io.r2dbc:r2dbc-h2", version = "1.1.0.RELEASE" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-loggerSlf4j = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

postgre = { module = "org.postgresql:r2dbc-postgresql", version.ref = "postgre" }
koin-logger = {module = "io.insert-koin:koin-logger-slf4j" , version.ref = "koin"}
datetime = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
bcrypt = { module = "org.mindrot:jbcrypt", version.ref = "bcrypt-version"}

aws = { module = "aws.sdk.kotlin:s3", version.ref = "b2" }


[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
